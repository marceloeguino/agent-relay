name: CI

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: agent-relay
  KIND_CLUSTER: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit + protocol tests (starter's own suite)
        run: uv run pytest test_agent_relay.py -q
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay

      - name: Run API integration test against PostgreSQL
        run: uv run pytest test_integration_flow.py -q
        env:
          RELAY_DATABASE_URL_OVERRIDE: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay

  build-and-deploy:
    needs: test
    # Only reached if the `test` job succeeded -- a failing test job stops
    # the workflow here: no image is built, nothing is deployed, and the
    # previously-deployed version keeps running untouched in the cluster.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure kind and kubectl are available
        run: |
          if ! command -v kubectl >/dev/null; then
            echo "Installing kubectl..."
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          if ! command -v kind >/dev/null; then
            echo "Installing kind..."
            curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
            install -m 0755 /tmp/kind /usr/local/bin/kind
          fi
          kubectl version --client
          kind version

      - name: Compute a unique image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t ${IMAGE_NAME}:${{ steps.tag.outputs.tag }} .

      - name: Load image into kind
        # `kind load docker-image` intermittently fails with "failed to
        # detect containerd snapshotter" when driven via `docker exec` from
        # inside another container (known kind flakiness, e.g.
        # kubernetes-sigs/kind#3130). Streaming the image straight into
        # `ctr` over stdin sidesteps both that probe and any intermediate
        # temp-file path quirks from `docker cp` into the node container.
        run: |
          docker save "${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" \
            | docker exec -i "${KIND_CLUSTER}-control-plane" ctr --namespace=k8s.io images import -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/postgres-secret.yaml
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/api-deployment.yaml

      - name: Point the Deployment at the new image tag
        run: |
          kubectl set image deployment/agent-relay-api \
            api=${IMAGE_NAME}:${{ steps.tag.outputs.tag }}

      - name: Wait for rollout to finish
        run: kubectl rollout status deployment/agent-relay-api --timeout=120s
