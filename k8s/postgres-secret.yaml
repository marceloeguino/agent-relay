apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-postgres
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  POSTGRES_DB: agent_relay
  # Full DSN the API container uses to reach Postgres via the "postgres"
  # Service's cluster-DNS name (postgres.<namespace>.svc.cluster.local,
  # reachable in-cluster simply as "postgres").
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
