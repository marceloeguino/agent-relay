services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_relay
      POSTGRES_PASSWORD: agent_relay
      POSTGRES_DB: agent_relay
    ports:
      - "5432:5432"
    volumes:
      - agent-relay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_relay -d agent_relay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: agent-relay:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" is the Compose service name above -- on the Compose
      # network, service names resolve as hostnames (Compose runs its own
      # embedded DNS), so the API reaches the database at that name, not
      # localhost or an IP.
      RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
    ports:
      - "8000:8000"

volumes:
  agent-relay-pgdata:
